services:
  backend:
    build: backend
    container_name: backend_app
    environment:
      - PORT=8080
      - HOST=0.0.0.0
    expose:
      - "8080"
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge